<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="checkout-container">

  <div class="checkout-box">

    <h2>Shipping Details</h2>

    <input type="text" id="name" placeholder="Full Name">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="address" placeholder="Address">
    <input type="text" id="city" placeholder="City">
    <input type="text" id="pincode" placeholder="Pincode">

    <div id="cardFields" class="hidden">

      <h2>Card Details</h2>

      <input type="text" id="cardName" placeholder="Card Holder Name">
      <input type="text" id="cardNumber" placeholder="Card Number">
      <input type="text" id="expiry" placeholder="MM/YY">
      <input type="text" id="cvv" placeholder="CVV">

      <button class="card-btn" onclick="payWithCard()">
        Confirm Card Payment
      </button>

    </div>

    <button class="gpay-btn" onclick="payWithGPay()">
      Pay With Google Pay
    </button>

    <button class="card-btn" onclick="showCardFields()">
      Pay With Card
    </button>

    <button class="cod-btn" onclick="placeCODOrder()">
      Cash On Delivery
    </button>

    <div class="loader" id="loader"></div>

  </div>

  <div class="summary-box">

    <h2>Order Summary</h2>

    <div id="checkoutItems"></div>

    <h2 id="checkoutTotal"></h2>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
