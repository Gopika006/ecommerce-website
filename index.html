<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GlowMart Ecommerce</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

  <div class="logo">GlowMart</div>

  <input type="text" id="searchInput" placeholder="Search products...">

  <nav>
    <a href="index.html">Home</a>
    <a href="cart.html">
      Cart (<span id="cartCount">0</span>)
    </a>
  </nav>

</header>

<section class="hero">

  <div class="hero-content">
    <h1>Modern Ecommerce Website</h1>
    <p>Fashion • Makeup • Kitchen • Accessories</p>

    <a href="#products" class="shop-btn">
      Shop Now
    </a>
  </div>

</section>

<section class="categories">

  <button onclick="filterProducts('all')">All</button>
  <button onclick="filterProducts('dress')">Dress</button>
  <button onclick="filterProducts('makeup')">Makeup</button>
  <button onclick="filterProducts('skincare')">Skincare</button>
  <button onclick="filterProducts('kitchen')">Kitchen</button>
  <button onclick="filterProducts('accessories')">Accessories</button>

</section>

<section class="products" id="products"></section>

<script src="script.js"></script>
</body>
</html>
